<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Move Item Up Down</title>

    <style>
      .up {
        color: green;
      }

      .down {
        color: red;
      }

      .up,
      .down {
        cursor: pointer;
      }

      li {
        padding: 5px;
        border-bottom: 1px solid #efefef;
        margin-bottom: 5px;
      }
    </style>
  </head>

  <body>
    <ul id="item-list">
      <li>
        Item 1
        <span class="up">Up</span>
        <span class="down">Down</span>
      </li>

      <li>
        Item 2
        <span class="up">Up</span>
        <span class="down">Down</span>
      </li>

      <li>
        Item 3
        <span class="up">Up</span>
        <span class="down">Down</span>
      </li>

      <li>
        Item 4
        <span class="up">Up</span>
        <span class="down">Down</span>
      </li>
    </ul>

    <script src="bai1.js"></script>
  </body>
</html>
