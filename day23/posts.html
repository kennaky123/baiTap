<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quản lý bài viết</title>
    <link rel="stylesheet" href="./style.css" />
  </head>

  <body>
    <header class="header">
      <div>
        <h2>Blog Manager</h2>
        <p id="userInfo"></p>
      </div>

      <button id="logoutBtn" class="danger">Đăng xuất</button>
    </header>

    <main class="container">
      <div class="toolbar">
        <input
          type="text"
          id="searchInput"
          placeholder="Tìm kiếm bài viết..."
        />

        <button id="showAddFormBtn">+ Thêm bài viết</button>
      </div>

      <section id="addPostSection" class="form-box hidden">
        <h2>Thêm bài viết</h2>

        <form id="addPostForm">
          <div class="form-group">
            <label>Tiêu đề</label>

            <input type="text" id="postTitle" placeholder="Nhập tiêu đề" />
          </div>

          <div class="form-group">
            <label>Nội dung</label>

            <textarea id="postBody" placeholder="Nhập nội dung"></textarea>
          </div>

          <p id="addPostError" class="error"></p>

          <div class="button-group">
            <button type="submit">Thêm</button>

            <button type="button" id="cancelAddBtn" class="secondary">
              Huỷ
            </button>
          </div>
        </form>
      </section>

      <p id="message"></p>

      <div id="loading" class="loading">Đang tải bài viết...</div>

      <section id="postList"></section>
    </main>


    <dialog id="detailDialog">
      <div class="dialog-content">
        <h2 id="detailTitle"></h2>

        <p id="detailBody"></p>

        <div id="detailTags"></div>

        <button id="closeDetailBtn">Đóng</button>
      </div>
    </dialog>

    <dialog id="editDialog">
      <form id="editPostForm">
        <h2>Sửa bài viết</h2>

        <input type="hidden" id="editPostId" />

        <div class="form-group">
          <label>Tiêu đề</label>

          <input type="text" id="editTitle" />
        </div>

        <div class="form-group">
          <label>Nội dung</label>

          <textarea id="editBody"></textarea>
        </div>

        <p id="editError" class="error"></p>

        <div class="button-group">
          <button type="submit">Lưu thay đổi</button>

          <button id="cancelEditBtn" type="button" class="secondary">
            Huỷ
          </button>
        </div>
      </form>
    </dialog>

    <script src="./posts.js"></script>
  </body>
</html>
