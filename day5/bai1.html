<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="bai1.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <title>Document</title>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <ul>
          <li><a href="#">Home</a></li>
          <li><a href="#">Pages</a></li>
          <li><a href="#">Articles</a></li>
        </ul>
        <a href="#"><img src="logo.png" alt="logo" /></a>
        <ul>
          <li><a href="#Contact">Contact</a></li>
          <li><a href="#">Shop</a></li>
          <li><a href="#">Locations</a></li>
        </ul>
      </div>
      <!-- header -->
      <div class="banner">
        <img src="banner.png" alt="banner" />
      </div>
      <!-- banner -->
      <div class="text">
        <p class="text-orange">BECAUSE WE LOVE COFFEE</p>
        <p class="text-black">About Us</p>
      </div>
      <section class="grid">
        <div class="colum-1">
          <div class="text-grid">
            <p class="text-orange-grid">HOME DELIVERY</p>
            <p class="text-black-grid">Quality coffee delivered to your door</p>
          </div>
          <img src="colum1.png" alt="coffee" class="img-grid" />
        </div>
        <div class="colum-2">
          <div class="text-grid">
            <p class="text-orange-grid">OUR MISSION</p>
            <p class="text-black-grid">
              It all began with a modest concept: Create amazing coffee
            </p>
          </div>
          <img src="colum2.png" alt="coffee" class="img-grid" />
        </div>
        <div class="colum-3">
          <div class="text-grid">
            <p class="text-orange-grid">TIME TO CHILL</p>
            <p class="text-black-grid">Black Coffee Shaved Ice</p>
          </div>
          <img src="colum3.png" alt="coffee" class="img-grid" />
        </div>
      </section>
      <img src="last-banner.png" alt="banner" class="last-banner" />
      <hr />
      <div class="footer" id="Contact">
        <img src="logo.png" alt="logo" />
        <form>
          <div class="form">
            <input type="text" placeholder="Enter email address..." required />
            <button class="button" type="submit">Contact us</button>
          </div>
        </form>
      </div>
    </div>
    <!--container -->
  </body>
</html>
